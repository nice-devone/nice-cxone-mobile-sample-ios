targetTemplates:
  Info:
    info:
      path: "generated/${target_name}_info.plist"
      properties:
        CFBundleDisplayName: "$(DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Allow access to camera to take pictures for sending as attachment."
        NSMicrophoneUsageDescription: "Allow access to microphone to be able to record a voice message."
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - remote-notification
        UIRequiredDeviceCapabilities:
          - armv7
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        WKAppBoundDomains: []
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER)"
            CFBundleURLSchemes:
              - "$(PRODUCT_BUNDLE_IDENTIFIER)"
          - CFBundleURLName: "Android App Scheme"
            CFBundleURLSchemes:
              - "com.nice.cxonechat.sample"
          # Google OAuth redirect (AppAuth) — the scheme is the reversed client ID from
          # GoogleService-Info.plist (scheme only, no ":/" or path). AppAuth derives the full
          # redirect URI from it as reversedClientId:/
          - CFBundleURLName: "Google OAuth"
            CFBundleURLSchemes:
              - "com.googleusercontent.apps.380097439409-h4kmchq0c9ajm2m5gqjrac198etj28ah"
