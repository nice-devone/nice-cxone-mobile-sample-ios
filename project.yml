include:
  - path: xcodegen/defaults.yml
    relativePaths: false
  - path: xcodegen/entitlements.yml
    relativePaths: false
  - path: xcodegen/infoPlist.yml
    relativePaths: false
  - path: xcodegen/packages.yml
    relativePaths: false
  - local.yml

options:
  createIntermediateGroups: true
  bundleIdPrefix: ${BUNDLE_PREFIX}

name: iOSSDKExample

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.sample

targetTemplates:
  Common:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      base:
        PRODUCT_NAME: iOSSDKExample
        DISPLAY_NAME: "SDK Demo"
    sources:
      - path: iOSSDKExample/Sources
      - path: iOSSDKExample/Supporting Files
    dependencies:
      - package: CXoneChatSDK
      - package: CXoneChatUI
      - package: CXoneGuideUtility
      - package: AppAuth
      - package: Firebase
        product: FirebaseCrashlytics
    postCompileScripts:
      - script: |
          if [[ "$(uname -m)" == arm64 ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi

          if which swiftlint > /dev/null; then
            swiftlint --config .swiftlint.yml
          else
            echo "warning: SwiftLint not installed, run brew install swiftlint"
          fi
        name: Swiftlint
        basedOnDependencyAnalysis: false

      - script: |
          if [[ "$(uname -m)" == arm64 ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi

          if which swiftgen > /dev/null; then
            swiftgen config -c .swiftgen.yml
          else
            echo "warning: SwiftGen not installed, run brew install swiftgen"
          fi
        name: SwiftGen
        runOnlyWhenInstalling: true
        basedOnDependencyAnalysis: true
    preBuildScripts:
      - script: |
          # Get current git branch
          gitBranch=$(git rev-parse --abbrev-ref HEAD)
          
          # Get current git commit hash
          gitCommit=$(git rev-parse --short HEAD)

          # Prepare build number in the format "yyyyMMddHHmm"
          buildNumber=$(date +'%Y%m%d%H%M')

          # Get tag name if available
          gitTag=$(git tag --points-at HEAD | grep .)

          # Store values in temporary files for post-build script
          echo "$buildNumber" > "${DERIVED_FILE_DIR}/build_number.txt"
          echo "$gitBranch" > "${DERIVED_FILE_DIR}/git_branch.txt"
          echo "$gitCommit" > "${DERIVED_FILE_DIR}/git_commit.txt"

          if [ -n "$gitTag" ]; then
            echo "$gitTag" > "${DERIVED_FILE_DIR}/git_tag.txt"
          fi

          # Update the build number in the source Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $buildNumber" "${SRCROOT}/generated/iOSSDKExample_info.plist"
          # Add the git branch to the source Info.plist
          /usr/libexec/PlistBuddy -c "Add :GitBranch string $gitBranch" "${SRCROOT}/generated/iOSSDKExample_info.plist" || /usr/libexec/PlistBuddy -c "Set :GitBranch $gitBranch" "${SRCROOT}/generated/iOSSDKExample_info.plist"
          # Add the git commit to the source Info.plist
          /usr/libexec/PlistBuddy -c "Add :GitCommit string $gitCommit" "${SRCROOT}/generated/iOSSDKExample_info.plist" || /usr/libexec/PlistBuddy -c "Set :GitCommit $gitCommit" "${SRCROOT}/generated/iOSSDKExample_info.plist"
          # Add the git tag to the source Info.plist if available
          if [ -n "$gitTag" ]; then
            /usr/libexec/PlistBuddy -c "Add :GitTag string $gitTag" "${SRCROOT}/generated/iOSSDKExample_info.plist" || /usr/libexec/PlistBuddy -c "Set :GitTag $gitTag" "${SRCROOT}/generated/iOSSDKExample_info.plist"
          fi
        name: Generate Source Build Number
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - script: |
          # Read values from temporary files created in pre-build
          if [ -f "${DERIVED_FILE_DIR}/build_number.txt" ]; then
            buildNumber=$(cat "${DERIVED_FILE_DIR}/build_number.txt")
          else
            # Fallback in case the file doesn't exist
            buildNumber="Unknown"
          fi
          
          if [ -f "${DERIVED_FILE_DIR}/git_branch.txt" ]; then
            gitBranch=$(cat "${DERIVED_FILE_DIR}/git_branch.txt")
          else
            # Fallback in case the file doesn't exist
            gitBranch=$(git rev-parse --abbrev-ref HEAD)
          fi

          if [ -f "${DERIVED_FILE_DIR}/git_commit.txt" ]; then
            gitCommit=$(cat "${DERIVED_FILE_DIR}/git_commit.txt")
          else
            # Fallback in case the file doesn't exist
            gitCommit=$(git rev-parse --short HEAD)
          fi

          if [ -f "${DERIVED_FILE_DIR}/git_tag.txt" ]; then
            gitTag=$(cat "${DERIVED_FILE_DIR}/git_tag.txt")
          else
            # Fallback in case the file doesn't exist
            gitTag=$(git tag --points-at HEAD | grep .)
          fi
          

          # Update the build number in the Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $buildNumber" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          
          # Add the git branch to the Info.plist
          /usr/libexec/PlistBuddy -c "Add :GitBranch string $gitBranch" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" || /usr/libexec/PlistBuddy -c "Set :GitBranch $gitBranch" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          
          # Add the git commit to the Info.plist
          /usr/libexec/PlistBuddy -c "Add :GitCommit string $gitCommit" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" || /usr/libexec/PlistBuddy -c "Set :GitCommit $gitCommit" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          # Add the git tag to the Info.plist if available
          if [ -n "$gitTag" ]; then
            /usr/libexec/PlistBuddy -c "Add :GitTag string $gitTag" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" || /usr/libexec/PlistBuddy -c "Set :GitTag $gitTag" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          fi

          # Update the build number in the dSYM Info.plist if it exists
          if [ -f "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}.dSYM/Contents/Info.plist" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $buildNumber" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}.dSYM/Contents/Info.plist"
            
            # Add the git branch to the dSYM Info.plist
            /usr/libexec/PlistBuddy -c "Add :GitBranch string $gitBranch" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}.dSYM/Contents/Info.plist" || /usr/libexec/PlistBuddy -c "Set :GitBranch $gitBranch" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}.dSYM/Contents/Info.plist"
            
            # Add the git commit to the dSYM Info.plist
            /usr/libexec/PlistBuddy -c "Add :GitCommit string $gitCommit" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}.dSYM/Contents/Info.plist" || /usr/libexec/PlistBuddy -c "Set :GitCommit $gitCommit" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}.dSYM/Contents/Info.plist"
            
            # Add the git tag to the dSYM Info.plist if available
            if [ -n "$gitTag" ]; then
              /usr/libexec/PlistBuddy -c "Add :GitTag string $gitTag" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}.dSYM/Contents/Info.plist" || /usr/libexec/PlistBuddy -c "Set :GitTag $gitTag" "${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}.dSYM/Contents/Info.plist"
            fi
          fi
        name: Generate Build Number
        basedOnDependencyAnalysis: false
      - script: |
          CRASHLYTICS_RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          CRASHLYTICS_LOG="${TARGET_TEMP_DIR}/crashlytics-upload-symbols.log"
          CRASHLYTICS_TIMEOUT_SECONDS=30

          # `Crashlytics/run` validates synchronously in the foreground (no `&`) before
          # backgrounding the actual symbol upload — the background half already redirects
          # its own output to /dev/null, so it can't hold this phase's pipe open. It's that
          # foreground validation call that can hang: on a network that can't reach
          # Firebase's upload endpoint, it has been observed to hang indefinitely (stuck in
          # DNS/route resolution, no established connection) instead of failing fast,
          # wedging this build phase — and with it the whole build queue — until the
          # process is killed by hand. Run it detached with its own log and a hard deadline
          # so a stalled validation can never hang the build again; a healthy run finishes
          # in a couple of seconds.
          "$CRASHLYTICS_RUN" < /dev/null > "$CRASHLYTICS_LOG" 2>&1 &
          crashlyticsPid=$!

          # `kill "$watchdogPid"` below only terminates this subshell, not the `sleep` it's
          # blocked in — that sleep is orphaned rather than killed and survives until its
          # countdown ends. Redirected here (rather than left inheriting the build phase's
          # own stdout/stderr) so that orphan can never hold the phase's pipe open — `>>`
          # (append, not `>`) because `$CRASHLYTICS_RUN` above already opened the same file
          # truncating; two truncating writers on one path would race.
          (
            sleep "$CRASHLYTICS_TIMEOUT_SECONDS"
            if kill -0 "$crashlyticsPid" 2>/dev/null; then
              echo "warning: Crashlytics dSYM upload exceeded ${CRASHLYTICS_TIMEOUT_SECONDS}s — killing it so the build doesn't hang. See $CRASHLYTICS_LOG"
              pkill -9 -P "$crashlyticsPid" 2>/dev/null
              kill -9 "$crashlyticsPid" 2>/dev/null
            fi
          ) < /dev/null >> "$CRASHLYTICS_LOG" 2>&1 &
          watchdogPid=$!

          wait "$crashlyticsPid" 2>/dev/null
          crashlyticsStatus=$?
          kill "$watchdogPid" 2>/dev/null
          wait "$watchdogPid" 2>/dev/null

          # A nonzero status here is either the watchdog's kill above (already logged) or a
          # genuine failure (bad path, missing GoogleService-Info.plist, bad credentials) —
          # surface it as a build warning instead of letting `exit 0` below hide it silently.
          if [ "$crashlyticsStatus" -ne 0 ]; then
            echo "warning: Crashlytics dSYM upload exited ${crashlyticsStatus}. See $CRASHLYTICS_LOG"
          fi

          exit 0
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        name: Crashlytics - Upload dSYM Files
        basedOnDependencyAnalysis: false

targets:
  iOSSDKExample:
    templates: [Common, Entitled, Info]


schemes:
  iOSSDKExample:
    build:
      targets:
        iOSSDKExample: all
